<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>數學加減法配對遊戲</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px;
    }
    .container { width: 100%; max-width: 900px; }
    .screen { display: none; }
    .screen.active { display: block; }
    .card {
      background: white; border-radius: 20px; padding: 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2); text-align: center;
    }
    h1 { font-size: 2rem; color: #333; margin-bottom: 10px; }
    .subtitle { color: #666; margin-bottom: 30px; font-size: 1.1rem; }
    form { max-width: 400px; margin: 0 auto; text-align: left; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; color: #444; font-weight: bold; font-size: 1rem; }
    input, select {
      width: 100%; padding: 12px 15px; border: 2px solid #e0e0e0;
      border-radius: 10px; font-size: 1rem; transition: border-color 0.3s;
    }
    input:focus, select:focus { outline: none; border-color: #667eea; }
    .btn {
      display: inline-block; padding: 14px 32px; border: none;
      border-radius: 10px; font-size: 1.1rem; font-weight: bold; cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn-primary { background: linear-gradient(135deg,#667eea 0%,#764ba2 100%); color: white; box-shadow: 0 4px 15px rgba(102,126,234,0.4); }
    .btn-secondary { background: #f0f0f0; color: #444; margin-left: 10px; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .game-header {
      background: white; border-radius: 15px; padding: 15px 25px; margin-bottom: 20px;
      display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1); flex-wrap: wrap; gap: 10px;
    }
    .player-info { display: flex; gap: 15px; font-weight: bold; color: #333; }
    .game-stats { display: flex; gap: 25px; }
    .stat { text-align: center; }
    .stat-label { display: block; font-size: 0.85rem; color: #888; margin-bottom: 3px; }
    .stat-value { display: block; font-size: 1.3rem; font-weight: bold; color: #667eea; }
    .game-board { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .column { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    .column h2 { text-align: center; color: #667eea; margin-bottom: 15px; font-size: 1.3rem; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
    .card-item {
      background: linear-gradient(135deg,#f5f7fa 0%,#e4e8f0 100%);
      border: 3px solid transparent; border-radius: 12px; padding: 16px 8px;
      text-align: center; cursor: pointer; font-size: 1.15rem; font-weight: bold;
      color: #333; min-height: 55px; display: flex; align-items: center;
      justify-content: center; user-select: none; transition: all 0.25s;
    }
    .card-item:hover { transform: translateY(-3px); box-shadow: 0 6px 15px rgba(0,0,0,0.15); border-color: #667eea; }
    .card-item.selected { background: linear-gradient(135deg,#667eea 0%,#764ba2 100%); color: white; border-color: #667eea; transform: scale(1.08); box-shadow: 0 8px 20px rgba(102,126,234,0.4); }
    .card-item.matched { visibility: hidden; pointer-events: none; }
    .card-item.wrong { animation: shake 0.4s; background: #ffe6e6; border-color: #ff6b6b; }
    @keyframes shake {
      0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}
    }
    .result-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); gap: 15px; margin: 30px 0; }
    .result-item { background: #f8f9fa; border-radius: 12px; padding: 15px; }
    .result-item.highlight { background: linear-gradient(135deg,#667eea 0%,#764ba2 100%); color: white; }
    .result-label { display: block; font-size: 0.9rem; margin-bottom: 5px; opacity: 0.9; }
    .result-value { display: block; font-size: 1.5rem; font-weight: bold; }
    .button-group { margin-top: 25px; }
    .save-status { margin: 15px 0; min-height: 24px; font-weight: bold; }
    .save-status.success { color: #28a745; }
    .save-status.error { color: #dc3545; }
    .save-status.loading { color: #667eea; }
    @media (max-width: 768px) {
      .game-board { grid-template-columns: 1fr; }
      .game-header { flex-direction: column; text-align: center; }
      .cards { grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); }
      .card-item { font-size: 1rem; padding: 12px 6px; }
      .card { padding: 25px; }
      h1 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <section id="start-screen" class="screen active">
      <div class="card">
        <h1>數學加減法配對</h1>
        <p class="subtitle">把算式和答案配對起來！</p>
        <form id="start-form">
          <div class="form-group">
            <label for="class-input">班級</label>
            <input type="text" id="class-input" placeholder="例如：三年甲班" required>
          </div>
          <div class="form-group">
            <label for="seat-input">座號</label>
            <input type="number" id="seat-input" placeholder="例如：5" min="1" required>
          </div>
          <div class="form-group">
            <label for="question-count">題數</label>
            <select id="question-count">
              <option value="6">6 題</option>
              <option value="10" selected>10 題</option>
              <option value="15">15 題</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary">開始遊戲</button>
        </form>
      </div>
    </section>

    <section id="game-screen" class="screen">
      <header class="game-header">
        <div class="player-info">
          <span id="display-class">-</span>
          <span id="display-seat">-</span>
        </div>
        <div class="game-stats">
          <div class="stat"><span class="stat-label">時間</span><span id="timer" class="stat-value">00:00</span></div>
          <div class="stat"><span class="stat-label">分數</span><span id="score" class="stat-value">0</span></div>
          <div class="stat"><span class="stat-label">進度</span><span id="progress" class="stat-value">0/0</span></div>
        </div>
      </header>
      <div class="game-board">
        <div class="column"><h2>算式</h2><div id="expressions" class="cards"></div></div>
        <div class="column"><h2>答案</h2><div id="answers" class="cards"></div></div>
      </div>
    </section>

    <section id="end-screen" class="screen">
      <div class="card">
        <h1>遊戲結束</h1>
        <div class="result-grid">
          <div class="result-item"><span class="result-label">班級</span><span id="end-class" class="result-value">-</span></div>
          <div class="result-item"><span class="result-label">座號</span><span id="end-seat" class="result-value">-</span></div>
          <div class="result-item"><span class="result-label">總題數</span><span id="end-total" class="result-value">-</span></div>
          <div class="result-item"><span class="result-label">正確題數</span><span id="end-correct" class="result-value">-</span></div>
          <div class="result-item"><span class="result-label">錯誤次數</span><span id="end-wrong" class="result-value">-</span></div>
          <div class="result-item"><span class="result-label">遊戲時間</span><span id="end-time" class="result-value">-</span></div>
          <div class="result-item highlight"><span class="result-label">總分</span><span id="end-score" class="result-value">-</span></div>
        </div>
        <div id="save-status" class="save-status"></div>
        <div class="button-group">
          <button id="save-btn" class="btn btn-primary">儲存成績</button>
          <button id="restart-btn" class="btn btn-secondary">再玩一次</button>
        </div>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    (function() {
      // ========== Supabase ==========
      var SUPABASE_URL = "https://deebjpgtujatpefucajc.supabase.co";
      var SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRlZWJqcGd0dWphdHBlZnVjYWpjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyMTk3NjgsImV4cCI6MjEwMDc5NTc2OH0.u9Q8Vv4z0XsPVN8zJVtdbo3_2Sv8lv9JD5SXbuWo5a4";
      var db;
      try { db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch(e) { db = null; }

      // ========== DOM refs ==========
      var $ = function(id) { return document.getElementById(id); };
      var startScreen = $("start-screen");
      var gameScreen = $("game-screen");
      var endScreen = $("end-screen");
      var startForm = $("start-form");
      var exprDiv = $("expressions");
      var ansDiv = $("answers");
      var timerEl = $("timer");
      var scoreEl = $("score");
      var progressEl = $("progress");
      var dClass = $("display-class");
      var dSeat = $("display-seat");
      var saveBtn = $("save-btn");
      var restartBtn = $("restart-btn");
      var saveStatus = $("save-status");

      // ========== State ==========
      var state = {
        cls: "", seat: 0, total: 10,
        pairs: [],
        selExpr: null, selAns: null,
        matched: 0, wrong: 0, score: 0,
        startTs: 0, timer: null, elapsed: 0, saved: false
      };

      // ========== Helpers ==========
      function show(s) {
        [startScreen, gameScreen, endScreen].forEach(function(x) { x.classList.remove("active"); });
        s.classList.add("active");
      }
      function fmt(sec) {
        var m = Math.floor(sec / 60); var s = sec % 60;
        return (m < 10 ? "0" + m : "" + m) + ":" + (s < 10 ? "0" + s : "" + s);
      }
      function genExpr() {
        var op = Math.random() < 0.5 ? "+" : "-";
        var a, b, ans;
        if (op === "+") { a = rand(1, 20); b = rand(1, 20); ans = a + b; }
        else { a = rand(2, 20); b = rand(1, a - 1); ans = a - b; }
        return { id: "q" + Math.random().toString(36).slice(2, 8), text: a + " " + op + " " + b, val: ans };
      }
      function rand(lo, hi) { return Math.floor(Math.random() * (hi - lo + 1)) + lo; }
      function genAll(n) {
        var list = [], seen = {};
        while (list.length < n) {
          var q = genExpr();
          if (!seen[q.val]) { seen[q.val] = true; list.push(q); }
        }
        return list;
      }
      function mix(arr) {
        var a = arr.slice();
        for (var i = a.length - 1; i > 0; i--) { var j = rand(0, i); var t = a[i]; a[i] = a[j]; a[j] = t; }
        return a;
      }
      function refresh() {
        timerEl.textContent = fmt(state.elapsed);
        scoreEl.textContent = state.score;
        progressEl.textContent = state.matched + "/" + state.total;
      }

      // ========== Timer ==========
      function startTimer() {
        state.startTs = Date.now(); state.elapsed = 0; refresh();
        state.timer = setInterval(function() {
          state.elapsed = Math.floor((Date.now() - state.startTs) / 1000);
          refresh();
        }, 1000);
      }
      function stopTimer() {
        clearInterval(state.timer);
        state.elapsed = Math.floor((Date.now() - state.startTs) / 1000);
        refresh();
      }

      // ========== Cards ==========
      function makeCard(text, kind, qId, val) {
        var c = document.createElement("div");
        c.className = "card-item"; c.textContent = text;
        c.setAttribute("data-kind", kind);
        c.setAttribute("data-qid", qId);
        c.setAttribute("data-val", val);
        c.onclick = function() { clickCard(c); };
        return c;
      }
      function renderBoard() {
        exprDiv.innerHTML = ""; ansDiv.innerHTML = "";
        var exprs = mix(state.pairs);
        var anss = mix(state.pairs);
        for (var i = 0; i < exprs.length; i++) {
          exprDiv.appendChild(makeCard(exprs[i].text, "expr", exprs[i].id, exprs[i].val));
        }
        for (var j = 0; j < anss.length; j++) {
          ansDiv.appendChild(makeCard(anss[j].val, "ans", anss[j].id, anss[j].val));
        }
      }

      // ========== Click logic ==========
      function clickCard(c) {
        if (c.classList.contains("matched")) return;
        var kind = c.getAttribute("data-kind");
        if (kind === "expr") {
          if (state.selExpr) state.selExpr.classList.remove("selected");
          state.selExpr = c; c.classList.add("selected");
        } else {
          if (state.selAns) state.selAns.classList.remove("selected");
          state.selAns = c; c.classList.add("selected");
        }
        tryMatch();
      }
      function tryMatch() {
        if (!state.selExpr || !state.selAns) return;
        var v1 = Number(state.selExpr.getAttribute("data-val"));
        var v2 = Number(state.selAns.getAttribute("data-val"));
        if (v1 === v2) {
          state.selExpr.classList.add("matched"); state.selExpr.classList.remove("selected");
          state.selAns.classList.add("matched"); state.selAns.classList.remove("selected");
          state.matched++; state.score += 10;
          state.selExpr = null; state.selAns = null;
          refresh();
          if (state.matched >= state.total) finish();
        } else {
          state.selExpr.classList.add("wrong"); state.selAns.classList.add("wrong");
          state.wrong++; state.score = Math.max(0, state.score - 2);
          refresh();
          var ex = state.selExpr, an = state.selAns;
          state.selExpr = null; state.selAns = null;
          setTimeout(function() { ex.classList.remove("selected", "wrong"); an.classList.remove("selected", "wrong"); }, 500);
        }
      }

      // ========== End ==========
      function finish() {
        stopTimer(); show(endScreen);
        $("end-class").textContent = state.cls;
        $("end-seat").textContent = state.seat;
        $("end-total").textContent = state.total;
        $("end-correct").textContent = state.matched;
        $("end-wrong").textContent = state.wrong;
        $("end-time").textContent = fmt(state.elapsed);
        $("end-score").textContent = state.score;
        saveStatus.textContent = ""; saveStatus.className = "save-status";
        saveBtn.disabled = false; saveBtn.textContent = "儲存成績";
        state.saved = false;
      }
      function restart() { show(startScreen); }
      function saveScore() {
        if (!db) { saveStatus.textContent = "無法連線資料庫"; saveStatus.className = "save-status error"; return; }
        if (state.saved) { saveStatus.textContent = "已儲存過了"; saveStatus.className = "save-status success"; return; }
        saveBtn.disabled = true; saveBtn.textContent = "儲存中...";
        saveStatus.textContent = "儲存中..."; saveStatus.className = "save-status loading";
        db.from("數學遊戲紀錄").insert({
          班級: state.cls, 座號: state.seat,
          分數: state.score, 遊戲秒數: state.elapsed,
          總題數: state.total, 正確題數: state.matched
        }).then(function(r) {
          if (r.error) throw r.error;
          state.saved = true;
          saveStatus.textContent = "成績已儲存至 Supabase！";
          saveStatus.className = "save-status success";
          saveBtn.textContent = "已儲存"; saveBtn.disabled = true;
        }).catch(function(e) {
          saveStatus.textContent = "儲存失敗，再試一次";
          saveStatus.className = "save-status error";
          saveBtn.disabled = false; saveBtn.textContent = "重新儲存";
        });
      }

      // ========== Start ==========
      function startGame(e) {
        e.preventDefault();
        state.cls = document.getElementById("class-input").value.trim();
        state.seat = parseInt(document.getElementById("seat-input").value, 10);
        state.total = parseInt(document.getElementById("question-count").value, 10);
        state.pairs = genAll(state.total);
        state.selExpr = null; state.selAns = null;
        state.matched = 0; state.wrong = 0; state.score = 0; state.saved = false;
        dClass.textContent = state.cls;
        dSeat.textContent = "座號 " + state.seat;
        show(gameScreen); renderBoard(); startTimer();
      }

      // ========== Bind ==========
      startForm.addEventListener("submit", startGame);
      saveBtn.addEventListener("click", saveScore);
      restartBtn.addEventListener("click", restart);
      show(startScreen);
    })();
  </script>
</body>
</html>
