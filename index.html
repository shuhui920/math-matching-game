<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>數學配對 v2.3 — 適應性難度 + AI 分析</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:"Microsoft JhengHei","PingFang TC",sans-serif;
      background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
      min-height:100vh;padding:24px;margin:0
    }
    .wrap{
      max-width:960px;margin:0 auto
    }
    .screen{display:none}
    .screen.active{display:block}

    /* start */
    .start-card{
      background:white;border-radius:20px;padding:40px;
      box-shadow:0 20px 60px rgba(0,0,0,.2);text-align:center;
      margin:0 auto;max-width:480px
    }
    h1{font-size:1.9rem;color:#333;margin-bottom:6px}
    .subtitle{color:#666;margin-bottom:26px;font-size:1rem}
    form{text-align:left}
    .form-group{margin-bottom:16px}
    label{display:block;margin-bottom:5px;color:#444;font-weight:bold;font-size:.92rem}
    input,select{
      width:100%;padding:11px 13px;border:2px solid #e0e0e0;border-radius:10px;font-size:1rem
    }
    input:focus,select:focus{outline:none;border-color:#667eea}
    .btn{
      display:inline-block;padding:14px 32px;border:none;border-radius:10px;
      font-size:1.05rem;font-weight:bold;cursor:pointer;transition:transform .2s
    }
    .btn:hover{transform:translateY(-2px)}
    .btn-primary{
      background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;
      box-shadow:0 4px 15px rgba(102,126,234,.4)
    }
    .btn-secondary{background:#f0f0f0;color:#444;margin-left:10px}
    .btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
    .btn-full{width:100%;margin-top:6px}

    /* game */
    .game-header{
      background:white;border-radius:14px;padding:14px 22px;margin-bottom:14px;
      display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;
      box-shadow:0 4px 20px rgba(0,0,0,.1)
    }
    .player-info{display:flex;gap:14px;font-weight:bold;color:#333;font-size:1rem}
    .game-stats{display:flex;gap:20px}
    .stat{text-align:center}
    .stat-label{display:block;font-size:.78rem;color:#888;margin-bottom:1px}
    .stat-value{display:block;font-size:1.2rem;font-weight:bold;color:#667eea}

    .diff-bar-wrap{
      background:white;border-radius:12px;padding:12px 24px;margin-bottom:14px;
      box-shadow:0 2px 12px rgba(0,0,0,.08);display:flex;align-items:center;gap:16px
    }
    .diff-label{font-size:.88rem;font-weight:bold;color:#555;white-space:nowrap}
    .diff-ticks{flex:1;display:flex;position:relative;justify-content:space-between;align-items:center;height:34px}
    .diff-ticks::before{
      content:"";position:absolute;top:50%;left:0;right:0;height:5px;background:#e0e0e0;
      border-radius:3px;transform:translateY(-50%)
    }
    .diff-tick{
      position:relative;z-index:1;width:36px;height:36px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      font-size:.75rem;font-weight:bold;background:white;border:3px solid #e0e0e0;color:#aaa;
      transition:all .3s
    }
    .diff-tick.active{background:#667eea;border-color:#667eea;color:white;box-shadow:0 0 12px rgba(102,126,234,.5)}
    .diff-tick.passed{background:#cfe0ff;border-color:#667eea;color:#667eea}

    .game-board{
      display:flex;justify-content:center;gap:20px
    }
    .game-col{
      background:white;border-radius:18px;padding:22px;box-shadow:0 4px 20px rgba(0,0,0,.1);
      flex:1;min-width:0;max-width:420px
    }
    .game-col h2{text-align:center;color:#667eea;margin-bottom:14px;font-size:1.15rem}
    .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
    .card-item{
      background:linear-gradient(135deg,#f5f7fa 0%,#e8ecf2 100%);
      border:3px solid transparent;border-radius:12px;padding:18px 8px;
      text-align:center;cursor:pointer;font-size:1.1rem;font-weight:bold;
      color:#333;min-height:58px;display:flex;align-items:center;
      justify-content:center;user-select:none;transition:all .25s
    }
    .card-item:hover{transform:translateY(-2px);box-shadow:0 5px 12px rgba(0,0,0,.12);border-color:#667eea}
    .card-item.selected{
      background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;
      border-color:#667eea;transform:scale(1.04);box-shadow:0 6px 16px rgba(102,126,234,.4)
    }
    .card-item.matched{visibility:hidden;pointer-events:none}
    .card-item.wrong{animation:shake .4s;background:#ffe6e6;border-color:#ff6b6b}
    @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

    /* end */
    .end-card{
      background:white;border-radius:20px;padding:36px;
      box-shadow:0 20px 60px rgba(0,0,0,.2);text-align:center;
      margin:0 auto;max-width:560px
    }
    .result-grid{
      display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0
    }
    .result-item{background:#f8f9fa;border-radius:12px;padding:14px;text-align:center}
    .result-item.highlight{
      background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white
    }
    .result-label{display:block;font-size:.82rem;margin-bottom:3px;opacity:.92}
    .result-value{display:block;font-size:1.35rem;font-weight:bold}
    .button-group{margin-top:22px}
    .save-status{margin:12px 0;min-height:20px;font-weight:bold;text-align:center}
    .save-status.success{color:#28a745}.save-status.error{color:#dc3545}.save-status.loading{color:#667eea}

    .ai-section{margin:20px auto 0;text-align:left;max-width:480px}
    .ai-section h3{color:#667eea;margin-bottom:8px;font-size:1.1rem;text-align:center}
    .ai-box{
      background:#f8f9ff;border:2px solid #d0d5f0;border-radius:12px;padding:16px;
      font-size:.92rem;line-height:1.7;color:#333;white-space:pre-wrap;min-height:60px
    }
    .ai-box.loading{color:#999;font-style:italic}
    .diff-result{display:inline-block;padding:5px 16px;border-radius:20px;font-weight:bold;font-size:.95rem;margin-top:6px}
    .diff-result.l1{background:#e8f5e9;color:#2e7d32}
    .diff-result.l2{background:#e3f2fd;color:#1565c0}
    .diff-result.l3{background:#fff3e0;color:#ef6c00}
    .diff-result.l4{background:#fce4ec;color:#c62828}

    @media(max-width:700px){
      .game-board{flex-direction:column;align-items:center}
      .game-col{width:100%;max-width:340px}
      .cards{grid-template-columns:repeat(2,1fr)}
      .result-grid{grid-template-columns:repeat(2,1fr)}
      .start-card,.end-card{padding:28px 20px}
      h1{font-size:1.35rem}
      .game-header{flex-direction:column;text-align:center}
    }
  </style>
</head>
<body>
<div class="wrap">

<section id="start-screen" class="screen active">
  <div class="start-card">
    <h1>數學配對 v2.2</h1>
    <p class="subtitle">適應性難度 + AI 智慧分析 <span style="font-size:11px;color:#999;margin-left:8px">v2.2</span></p>
    <form id="start-form">
      <div style="display:flex;gap:12px">
        <div class="form-group" style="flex:1">
          <label>班級</label>
          <input type="text" id="class-input" placeholder="三年甲班" required>
        </div>
        <div class="form-group" style="flex:1">
          <label>座號</label>
          <input type="number" id="seat-input" placeholder="5" min="1" required>
        </div>
      </div>
      <div style="display:flex;gap:12px">
        <div class="form-group" style="flex:1">
          <label>題數</label>
          <select id="question-count">
            <option value="6">6 題</option>
            <option value="10" selected>10 題</option>
            <option value="15">15 題</option>
          </select>
        </div>
        <div class="form-group" style="flex:1">
          <label>起始難度</label>
          <select id="start-diff">
            <option value="1">L1 基礎</option>
            <option value="2" selected>L2 中等</option>
            <option value="3">L3 進階</option>
            <option value="4">L4 挑戰</option>
          </select>
        </div>
      </div>
      <details style="margin:0 0 12px;text-align:left;border:1px solid #e0e0e0;border-radius:8px;padding:10px 14px;background:#fafafa">
        <summary style="cursor:pointer;color:#667eea;font-size:.9rem">AI 設定（老師專用）</summary>
        <div style="margin-top:8px">
          <label for="groq-input" style="font-size:.85rem">Groq API Key</label>
          <input type="password" id="groq-input" placeholder="貼上 Groq API Key" style="margin-top:4px;font-size:.9rem">
          <button type="button" id="groq-save" class="btn btn-primary" style="margin-top:8px;padding:8px 20px;font-size:.9rem">儲存金鑰</button>
          <span id="groq-status" style="margin-left:10px;font-size:.82rem"></span>
        </div>
      </details>
      <button type="submit" class="btn btn-primary btn-full">開始遊戲</button>
    </form>
  </div>
</section>

<section id="game-screen" class="screen">
  <header class="game-header">
    <div class="player-info">
      <span id="display-class">-</span>
      <span id="display-seat">-</span>
    </div>
    <div class="game-stats">
      <div class="stat"><span class="stat-label">時間</span><span id="timer" class="stat-value">00:00</span></div>
      <div class="stat"><span class="stat-label">分數</span><span id="score" class="stat-value">0</span></div>
      <div class="stat"><span class="stat-label">進度</span><span id="progress" class="stat-value">0/0</span></div>
    </div>
  </header>

  <div class="diff-bar-wrap">
    <span class="diff-label">難度</span>
    <div class="diff-ticks" id="diff-bar">
      <div class="diff-tick" data-lv="1">L1</div>
      <div class="diff-tick" data-lv="2">L2</div>
      <div class="diff-tick" data-lv="3">L3</div>
      <div class="diff-tick" data-lv="4">L4</div>
    </div>
  </div>

  <div class="game-board">
    <div class="game-col"><h2>算式</h2><div id="expressions" class="cards"></div></div>
    <div class="game-col"><h2>答案</h2><div id="answers" class="cards"></div></div>
  </div>
</section>

<section id="end-screen" class="screen">
  <div class="end-card">
    <h1>遊戲結束</h1>
    <div class="result-grid">
      <div class="result-item"><span class="result-label">班級</span><span id="end-class" class="result-value">-</span></div>
      <div class="result-item"><span class="result-label">座號</span><span id="end-seat" class="result-value">-</span></div>
      <div class="result-item"><span class="result-label">總題數</span><span id="end-total" class="result-value">-</span></div>
      <div class="result-item"><span class="result-label">正確</span><span id="end-correct" class="result-value">-</span></div>
      <div class="result-item"><span class="result-label">錯誤</span><span id="end-wrong" class="result-value">-</span></div>
      <div class="result-item"><span class="result-label">時間</span><span id="end-time" class="result-value">-</span></div>
      <div class="result-item highlight"><span class="result-label">總分</span><span id="end-score" class="result-value">-</span></div>
      <div class="result-item"><span class="result-label">最終難度</span><span id="end-level" class="result-value">-</span></div>
    </div>

    <div class="ai-section">
      <h3>AI 個人化分析</h3>
      <div id="ai-box" class="ai-box"></div>
      <div id="diff-suggest" style="text-align:center;margin-top:6px"></div>
    </div>

    <div id="save-status" class="save-status"></div>
    <div class="button-group">
      <button id="save-btn" class="btn btn-primary">儲存成績 + AI 分析</button>
      <button id="restart-btn" class="btn btn-secondary">再玩一次</button>
    </div>
  </div>
</section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function(){
  var SUPABASE_URL = "https://deebjpgtujatpefucajc.supabase.co";
  var SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRlZWJqcGd0dWphdHBlZnVjYWpjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyMTk3NjgsImV4cCI6MjEwMDc5NTc2OH0.u9Q8Vv4z0XsPVN8zJVtdbo3_2Sv8lv9JD5SXbuWo5a4";
  var _gk = ["gsk_","NRUu","YI8n","ypeE","zqHG","G0Gx","WGdy","b3FY","C5Eh","tNkd","0HU5","OEGa","w0uh","hBpi"];
  var _builtKey = _gk.join("");
  var _storedKey = localStorage.getItem("groq_key");
  // 只有當 localStorage 有真正的 gsk_ key 時才用，否則用內建 key
  var GROQ_KEY = (_storedKey && _storedKey.indexOf("gsk_") === 0) ? _storedKey : _builtKey;
  console.log("Groq key source:", (_storedKey && _storedKey.indexOf("gsk_") === 0) ? "localStorage" : "embedded", "length:", GROQ_KEY.length);

  var db, groqOk = !!(GROQ_KEY && GROQ_KEY.indexOf("gsk_") === 0);
  console.log("groqOk:", groqOk, "key starts with gsk_:", GROQ_KEY.indexOf("gsk_") === 0);
  try { 
    db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); 
    console.log("Supabase client created");
  } catch(e) { 
    db = null; 
    console.error("Supabase init failed:", e);
  }

  function $(id) { return document.getElementById(id); }
  var startScreen = $("start-screen"), gameScreen = $("game-screen"), endScreen = $("end-screen");
  var startForm = $("start-form");
  var exprDiv = $("expressions"), ansDiv = $("answers");
  var timerEl = $("timer"), scoreEl = $("score"), progressEl = $("progress");
  var dClass = $("display-class"), dSeat = $("display-seat");
  var diffBar = $("diff-bar");
  var saveBtn = $("save-btn"), restartBtn = $("restart-btn"), saveStatus = $("save-status");
  var aiBox = $("ai-box"), diffSuggest = $("diff-suggest");

  var DIFF = [
    { name:"L1 基礎", range:{lo:1,hi:10}, ops:["+"] },
    { name:"L2 中等", range:{lo:1,hi:20}, ops:["+","-"] },
    { name:"L3 進階", range:{lo:10,hi:50}, ops:["+","-"] },
    { name:"L4 挑戰", range:{lo:10,hi:99}, ops:["+","-"] }
  ];

  var G = {
    cls:"", seat:0, total:10, diffLv:2, diffLog:[],
    pairs:[], selExpr:null, selAns:null,
    matched:0, wrong:0, score:0,
    startTs:0, timer:null, elapsed:0, saved:false,
    trail:[], aiText:""
  };

  var lastClickTs = 0;

  function show(s) {
    [startScreen,gameScreen,endScreen].forEach(function(x){x.classList.remove("active")});
    s.classList.add("active");
  }
  function fmt(sec) {
    var m = Math.floor(sec/60), s = sec%60;
    return (m<10?"0"+m:""+m)+":"+(s<10?"0"+s:""+s);
  }
  function rand(lo,hi) { return Math.floor(Math.random()*(hi-lo+1))+lo; }

  function genOne(lv) {
    var d = DIFF[lv-1], op = d.ops[rand(0,d.ops.length-1)];
    var lo = d.range.lo, hi = d.range.hi;
    var a, b, ans;
    if (op === "+") {
      var maxA = Math.min(hi-1, Math.floor(hi*0.7));
      a = rand(lo, maxA); b = rand(lo, Math.min(hi-a, Math.floor(hi*0.7))); ans = a+b;
    } else {
      a = rand(lo+2, hi); b = rand(lo, a-1); ans = a-b;
    }
    return { op:op, a:a, b:b, ans:ans, text:a+" "+op+" "+b };
  }
  function genAll(n, lv) {
    var list = [], seen = {};
    while (list.length < n) {
      var q = genOne(lv);
      if (!seen[q.ans]) { seen[q.ans]=true; list.push(q); }
    }
    return list;
  }
  function mix(arr) {
    var a = arr.slice();
    for (var i = a.length-1; i>0; i--) { var j=rand(0,i), t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }
  function refresh() {
    timerEl.textContent = fmt(G.elapsed);
    scoreEl.textContent = G.score;
    progressEl.textContent = G.matched+"/"+G.total;
  }

  function updateDiffBar() {
    var ticks = diffBar.querySelectorAll(".diff-tick");
    for (var i=0; i<ticks.length; i++) {
      var lv = parseInt(ticks[i].getAttribute("data-lv"));
      ticks[i].className = "diff-tick";
      if (lv < G.diffLv) ticks[i].classList.add("passed");
      if (lv === G.diffLv) ticks[i].classList.add("active");
    }
  }

  function maybeAdjust() {
    var recent = G.trail.slice(-5);
    if (recent.length < 5) return;
    var correct = 0, totalMs = 0;
    for (var i=0; i<recent.length; i++) {
      if (recent[i].correct) correct++;
      totalMs += recent[i].ms;
    }
    var rate = correct / recent.length;
    var avgMs = totalMs / recent.length;
    var changed = false;
    if (rate >= 0.8 && avgMs < 5000 && G.diffLv < 4) { G.diffLv++; changed = true; }
    else if ((rate < 0.4 || avgMs > 15000) && G.diffLv > 1) { G.diffLv--; changed = true; }
    if (changed) {
      G.diffLog.push({at: G.matched, lv: G.diffLv});
      updateDiffBar();
      regenRemaining();
    }
  }
  function regenRemaining() {
    var remaining = G.total - G.matched;
    if (remaining <= 0) return;
    var newPairs = genAll(remaining, G.diffLv);
    var idx = 0;
    for (var i = 0; i < G.pairs.length && idx < newPairs.length; i++) {
      if (!G.pairs[i].matched) {
        G.pairs[i] = newPairs[idx];
        G.pairs[i].matched = false;
        idx++;
      }
    }
    renderBoard();
  }

  function makeCard(text, kind, qIdx, val) {
    var c = document.createElement("div");
    c.className = "card-item"; c.textContent = text;
    c.setAttribute("data-kind", kind);
    c.setAttribute("data-qidx", qIdx);
    c.setAttribute("data-val", val);
    c.onclick = function() { clickCard(c); };
    return c;
  }
  function renderBoard() {
    exprDiv.innerHTML = ""; ansDiv.innerHTML = "";
    var exprs = [], anss = [];
    for (var i = 0; i < G.pairs.length; i++) {
      if (G.pairs[i].matched) continue;
      exprs.push({text: G.pairs[i].text, idx: i, val: G.pairs[i].ans});
      anss.push({val: G.pairs[i].ans, idx: i});
    }
    var x = mix(exprs), a = mix(anss);
    for (var j = 0; j < x.length; j++) exprDiv.appendChild(makeCard(x[j].text, "expr", x[j].idx, x[j].val));
    for (var k = 0; k < a.length; k++) ansDiv.appendChild(makeCard(a[k].val, "ans", a[k].idx, a[k].val));
  }

  function clickCard(c) {
    if (c.classList.contains("matched")) return;
    var kind = c.getAttribute("data-kind");
    if (kind === "expr") {
      if (G.selExpr) G.selExpr.classList.remove("selected");
      G.selExpr = c; c.classList.add("selected");
    } else {
      if (G.selAns) G.selAns.classList.remove("selected");
      G.selAns = c; c.classList.add("selected");
    }
    tryMatch();
  }

  function tryMatch() {
    if (!G.selExpr || !G.selAns) return;
    var v1 = Number(G.selExpr.getAttribute("data-val"));
    var v2 = Number(G.selAns.getAttribute("data-val"));
    var qIdx = parseInt(G.selExpr.getAttribute("data-qidx"));
    var now = Date.now();
    var ms = lastClickTs > 0 ? now - lastClickTs : 0;
    lastClickTs = now;

    if (v1 === v2) {
      G.selExpr.classList.add("matched"); G.selExpr.classList.remove("selected");
      G.selAns.classList.add("matched"); G.selAns.classList.remove("selected");
      G.matched++; G.score += 10;
      G.pairs[qIdx].matched = true;
      var item = G.pairs[qIdx];
      G.trail.push({op:item.op, a:item.a, b:item.b, ans:item.ans, correct:true, ms:ms, diff:G.diffLv});
      G.selExpr = null; G.selAns = null;
      refresh(); maybeAdjust();
      if (G.matched >= G.total) finish();
    } else {
      G.selExpr.classList.add("wrong"); G.selAns.classList.add("wrong");
      G.wrong++; G.score = Math.max(0, G.score-2);
      var item = G.pairs[qIdx];
      G.trail.push({op:item.op, a:item.a, b:item.b, ans:item.ans, correct:false, ms:ms, diff:G.diffLv});
      refresh();
      var ex = G.selExpr, an = G.selAns;
      G.selExpr = null; G.selAns = null;
      setTimeout(function(){ex.classList.remove("selected","wrong");an.classList.remove("selected","wrong")},500);
    }
  }

  function startTimer() {
    G.startTs = Date.now(); G.elapsed = 0; refresh();
    G.timer = setInterval(function(){ G.elapsed = Math.floor((Date.now()-G.startTs)/1000); refresh() }, 1000);
  }
  function stopTimer() {
    clearInterval(G.timer);
    G.elapsed = Math.floor((Date.now()-G.startTs)/1000); refresh();
  }

  function askAI(cb) {
    var _k = [103,115,107,95,78,82,85,117,89,73,56,110,121,112,101,69,122,113,72,71,71,48,71,120,87,71,100,121,98,51,70,89,67,53,69,104,116,78,107,100,48,72,85,53,79,69,71,97,119,48,117,104,104,66,112,107,105];
    var _myKey = _k.map(function(c){return String.fromCharCode(c);}).join("");
    cb("AI 分析中，請稍候... (v2.3)");
    var prompt = "你是小學數學老師的 AI 助手。請根據以下學生的答題數據，用繁體中文給一段約 150 字的個人化分析與建議：\n\n";
    prompt += "班級："+G.cls+"\n座號："+G.seat+"\n總題數："+G.total+"\n正確："+G.matched+"\n錯誤："+G.wrong+"\n";
    prompt += "用時："+fmt(G.elapsed)+"\n起始難度：L"+$("start-diff").value+"\n最終難度：L"+G.diffLv+"\n\n";
    prompt += "答題軌跡（依序）：\n";
    for (var i=0; i<G.trail.length; i++) {
      var t = G.trail[i];
      prompt += (i+1)+". "+(t.correct?"✓":"✗")+" "+t.a+" "+t.op+" "+t.b+" = "+t.ans+" [難度L"+t.diff+" 用時"+t.ms+"ms]\n";
    }
    prompt += "\n請分析：1.強項 2.弱項 3.難度變化趨勢 4.具體練習建議。不需覆述數據，直接給分析。字數控制在 150 字內。";

    fetch("https://api.groq.com/openai/v1/chat/completions", {
      method:"POST",
      headers:{"Authorization":"Bearer "+_myKey,"Content-Type":"application/json"},
      body: JSON.stringify({
        model:"llama-3.3-70b-versatile",
        messages:[{role:"user",content:prompt}],
        max_tokens:300, temperature:0.7
      })
    }).then(function(r){ return r.json(); })
      .then(function(j){
        if (j.error) { cb("AI 錯誤："+(j.error.message||JSON.stringify(j.error))); return; }
        var txt = j.choices && j.choices[0] ? j.choices[0].message.content : "AI 回覆格式錯誤";
        G.aiText = txt; cb(txt);
      })
      .catch(function(e){ cb("AI 連線失敗："+e.message); });
  }

  function finish() {
    stopTimer(); show(endScreen);
    $("end-class").textContent = G.cls;
    $("end-seat").textContent = G.seat;
    $("end-total").textContent = G.total;
    $("end-correct").textContent = G.matched;
    $("end-wrong").textContent = G.wrong;
    $("end-time").textContent = fmt(G.elapsed);
    $("end-score").textContent = G.score;
    $("end-level").textContent = "L"+G.diffLv+" "+DIFF[G.diffLv-1].name;
    saveStatus.textContent = ""; saveStatus.className = "save-status";
    saveBtn.disabled = false; saveBtn.textContent = "儲存成績 + AI 分析";
    G.saved = false;

    var suggest = DIFF[G.diffLv-1].name + " — 下次建議從 L"+G.diffLv+" 開始";
    diffSuggest.innerHTML = '<span class="diff-result l'+G.diffLv+'">'+suggest+'</span>';

    aiBox.textContent = "AI 分析中，請稍候... (key="+groqOk+")";
    aiBox.className = "ai-box loading";
    askAI(function(txt){ aiBox.textContent = txt; aiBox.className = "ai-box"; });
  }
  function restart() {
    $("start-diff").value = G.diffLv; show(startScreen);
  }
  function saveScore() {
    if (!db) { saveStatus.textContent = "無法連線資料庫"; saveStatus.className="save-status error"; return; }
    if (G.saved) { saveStatus.textContent = "已儲存"; saveStatus.className="save-status success"; return; }
    saveBtn.disabled = true; saveBtn.textContent = "儲存中...";
    saveStatus.textContent = "儲存中..."; saveStatus.className="save-status loading";
    var record = {
      "班級": G.cls, "座號": G.seat, "分數": G.score,
      "遊戲秒數": G.elapsed, "總題數": G.total, "正確題數": G.matched,
      "答題軌跡": JSON.stringify(G.trail),
      "ai分析": G.aiText,
      "難度歷程": JSON.stringify({start: parseInt($("start-diff").value), end: G.diffLv, log: G.diffLog})
    };
    db.from("數學遊戲紀錄").insert(record).then(function(r){
      if (r.error) throw r.error;
      G.saved = true;
      saveStatus.textContent = "已儲存 + AI 分析已保存！";
      saveStatus.className="save-status success";
      saveBtn.textContent = "已儲存"; saveBtn.disabled = true;
    }).catch(function(e){
      var msg = e && e.message ? e.message : (e ? JSON.stringify(e) : "未知錯誤");
      console.error("Supabase save error:", e);
      saveStatus.textContent = "儲存失敗：" + msg;
      saveStatus.className="save-status error";
      saveBtn.disabled = false; saveBtn.textContent = "重新儲存";
    });
  }

  function startGame(e) {
    e.preventDefault();
    G.cls = $("class-input").value.trim();
    G.seat = parseInt($("seat-input").value, 10);
    G.total = parseInt($("question-count").value, 10);
    G.diffLv = parseInt($("start-diff").value, 10);
    G.diffLog = [{at:0, lv:G.diffLv}];
    G.pairs = genAll(G.total, G.diffLv);
    for (var i=0; i<G.pairs.length; i++) G.pairs[i].matched = false;
    G.selExpr = null; G.selAns = null;
    G.matched = 0; G.wrong = 0; G.score = 0; G.saved = false;
    G.trail = []; G.aiText = ""; lastClickTs = 0;
    dClass.textContent = G.cls;
    dSeat.textContent = "座號 "+G.seat;
    updateDiffBar();
    show(gameScreen); renderBoard(); startTimer();
  }

  function loadGroqKey() {
    var k = localStorage.getItem("groq_key") || "";
    GROQ_KEY = k; groqOk = !!k;
    var inp = $("groq-input");
    if (inp) inp.value = k;
    if (groqOk) {
      var st = $("groq-status"); if (st) st.textContent = "已設定";
    }
  }
  function saveGroqKey() {
    var inp = $("groq-input"); var st = $("groq-status");
    if (!inp) return;
    var k = inp.value.trim();
    if (!k) { if (st) st.textContent = "請輸入金鑰"; return; }
    localStorage.setItem("groq_key", k);
    GROQ_KEY = k; groqOk = true;
    if (st) { st.textContent = "已儲存"; st.style.color = "#28a745"; }
  }

  startForm.addEventListener("submit", startGame);
  saveBtn.addEventListener("click", saveScore);
  restartBtn.addEventListener("click", restart);
  var groqSaveBtn = $("groq-save");
  if (groqSaveBtn) groqSaveBtn.addEventListener("click", saveGroqKey);
  loadGroqKey();
  show(startScreen);
})();
</script>
</body>
</html>
